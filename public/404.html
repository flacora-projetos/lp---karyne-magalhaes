<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Página não encontrada | Dra. Karyne Magalhães</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root{--paper:#F6F0E9;--ink:#2B1B0A;--green:#222D19;--copper:#A95B21;--soft:#565E48;--line:#E4DFD9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);font-family:Geist,Arial,sans-serif;padding:24px 16px}
    main{max-width:520px;text-align:center}
    p.kicker{color:var(--copper);letter-spacing:.12em;text-transform:uppercase;font-size:13px;margin:0 0 12px}
    h1{font-family:Lora,Georgia,serif;font-weight:500;font-size:clamp(28px,6vw,40px);line-height:1.15;margin:0 0 16px;color:var(--green)}
    p{color:var(--soft);line-height:1.6;margin:0 0 28px}
    nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
    a{display:inline-block;padding:12px 20px;border-radius:999px;text-decoration:none;font-weight:500}
    a.primary{background:var(--green);color:#FEFEFE}
    a.secondary{border:1px solid var(--line);color:var(--ink);background:#FEFEFE}
  </style>
</head>
<body>
  <main>
    <p class="kicker">Erro 404</p>
    <h1>Esta página não foi encontrada.</h1>
    <p>O endereço pode ter mudado ou foi digitado com algum erro. Você pode voltar à página inicial ou ler os conteúdos sobre halitose no blog.</p>
    <nav>
      <a class="primary" href="/">Página inicial</a>
      <a class="secondary" href="/blog/">Ler o blog</a>
    </nav>
  </main>
</body>
</html>
